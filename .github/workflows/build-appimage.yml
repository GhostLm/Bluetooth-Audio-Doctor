name: Compilar AppImage autónoma

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'build-appimage.sh'
      - '.github/workflows/build-appimage.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Preparar entorno de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk xvfb curl librsvg2-bin
      - name: Ejecutar pruebas automatizadas
        run: xvfb-run -a python3 -m unittest discover -s tests -v
      - name: Crear AppImage con Python y Tk integrados
        run: bash build-appimage.sh
      - name: Verificar ejecutable autónomo
        run: |
          xvfb-run -a build/AppDir/AppRun --self-test
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a ./Bluetooth-Audio-Doctor-x86_64.AppImage --self-test
          file Bluetooth-Audio-Doctor-x86_64.AppImage
      - name: Adjuntar AppImage para descargar
        uses: actions/upload-artifact@v6
        with:
          name: Bluetooth-Audio-Doctor-Linux-x86_64
          path: Bluetooth-Audio-Doctor-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
