name: Publicar Bluetooth Audio Doctor 0.3.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Comprobar que la versión no está publicada
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.3.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "La versión v0.3.0 ya existe; no se sobrescribirá."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Preparar dependencias
        if: steps.existing.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk xvfb curl librsvg2-bin
      - name: Ejecutar pruebas
        if: steps.existing.outputs.exists == 'false'
        run: xvfb-run -a python3 -m unittest discover -s tests -v
      - name: Compilar AppImage autónoma
        if: steps.existing.outputs.exists == 'false'
        run: bash build-appimage.sh
      - name: Verificar AppImage y calcular SHA256
        if: steps.existing.outputs.exists == 'false'
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a ./Bluetooth-Audio-Doctor-x86_64.AppImage --self-test
          sha256sum Bluetooth-Audio-Doctor-x86_64.AppImage > SHA256SUMS
      - name: Publicar versión estable con AppImage
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 \
            Bluetooth-Audio-Doctor-x86_64.AppImage SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Bluetooth Audio Doctor 0.3.0" \
            --notes-file RELEASE_NOTES.md \
            --latest
      - name: Mostrar versión publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v0.3.0 --repo "${GITHUB_REPOSITORY}" --json url,tagName,isDraft,isPrerelease,assets
